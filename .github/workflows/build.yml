name: Build Android APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version:  17 

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version:  8.2 

      - name: Build APK
        working-directory: ./sultan-app/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: sultan-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as Release (easy download from phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sultan build ${{ github.run_number }}
          files: sultan-app/android/app/build/outputs/apk/debug/app-debug.apk
          
